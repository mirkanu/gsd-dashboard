<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Provider Selector - Sketch 001</title>
  <link rel="stylesheet" href="../themes/default.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      padding: var(--space-6);
      line-height: 1.5;
    }
    .sketch-container { max-width: 600px; margin: 0 auto; }
    .variant { display: none; }
    .variant.active { display: block; }
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-3) var(--space-6);
      display: flex;
      gap: var(--space-3);
      align-items: center;
      z-index: 100;
    }
    .toolbar button {
      padding: var(--space-2) var(--space-3);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: var(--text-sm);
      transition: all 0.15s;
    }
    .toolbar button:hover { border-color: var(--color-primary); color: var(--color-text); }
    .toolbar button.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-6);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .card-icon {
      width: 40px;
      height: 40px;
      background: var(--color-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .card-title { font-size: var(--text-lg); font-weight: 600; }
    .card-subtitle { font-size: var(--text-sm); color: var(--color-text-muted); }
    .label {
      display: block;
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
    }
    select, input[type="text"] {
      width: 100%;
      padding: var(--space-3);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-size: var(--text-sm);
      cursor: pointer;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .radio-group { display: flex; flex-direction: column; gap: var(--space-2); }
    .radio-option {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s;
    }
    .radio-option:hover { border-color: var(--color-primary); }
    .radio-option.selected {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: white;
    }
    .radio-option input { display: none; }
    .radio-dot {
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-radius: 50%;
      position: relative;
    }
    .radio-option.selected .radio-dot {
      border-color: white;
      background: white;
    }
    .radio-option.selected .radio-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }
    main { margin-top: 60px; }
    .status {
      margin-top: var(--space-4);
      padding: var(--space-3);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-success);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="active" onclick="showVariant('A')">Variant A: Dropdown</button>
    <button onclick="showVariant('B')">Variant B: Radio Cards ★</button>
    <button onclick="showVariant('C')">Variant C: Inline</button>
  </div>

  <main class="sketch-container">
    <!-- Variant A: Simple Dropdown -->
    <div class="variant active" id="variant-A">
      <div class="card">
        <div class="card-header">
          <div class="card-icon">LL</div>
          <div>
            <div class="card-title">LLM Provider</div>
            <div class="card-subtitle">Select your Claude API provider</div>
          </div>
        </div>

        <label class="label">Provider</label>
        <select onchange="updateStatus(this.value)">
          <option value="claude">Claude (anthropic.com)</option>
          <option value="zai">z.AI (api.z.ai)</option>
          <option value="ollama">Local Ollama (home PC)</option>
        </select>

        <div class="status">
          <span class="status-dot"></span>
          <span id="status-text">Active: Claude (anthropic.com)</span>
        </div>
      </div>
    </div>

    <!-- Variant B: Radio Card Options -->
    <div class="variant" id="variant-B">
      <div class="card">
        <div class="card-header">
          <div class="card-icon">LL</div>
          <div>
            <div class="card-title">LLM Provider</div>
            <div class="card-subtitle">Select your Claude API provider</div>
          </div>
        </div>

        <label class="label">Provider</label>
        <div class="radio-group">
          <label class="radio-option selected" onclick="selectRadio(this, 'Claude (anthropic.com)')">
            <input type="radio" name="provider" checked>
            <div class="radio-dot"></div>
            <span>Claude (anthropic.com)</span>
          </label>
          <label class="radio-option" onclick="selectRadio(this, 'z.AI (api.z.ai)')">
            <input type="radio" name="provider">
            <div class="radio-dot"></div>
            <span>z.AI (api.z.ai)</span>
          </label>
          <label class="radio-option" onclick="selectRadio(this, 'Local Ollama (home PC)')">
            <input type="radio" name="provider">
            <div class="radio-dot"></div>
            <span>Local Ollama (home PC)</span>
          </label>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          <span id="status-text-b">Active: Claude (anthropic.com)</span>
        </div>
      </div>
    </div>

    <!-- Variant C: Minimal Inline -->
    <div class="variant" id="variant-C">
      <div class="card">
        <div class="card-header">
          <div class="card-icon">LL</div>
          <div>
            <div class="card-title">LLM Provider</div>
            <div class="card-subtitle">Quick switch provider</div>
          </div>
        </div>

        <label class="label">Current Provider</label>
        <select onchange="updateStatusC(this.value)" style="margin-bottom: var(--space-4);">
          <option value="claude">Claude (anthropic.com)</option>
          <option value="zai">z.AI (api.z.ai)</option>
          <option value="ollama">Local Ollama (home PC via Tailscale)</option>
        </select>

        <div class="status">
          <span class="status-dot"></span>
          <span>Hot-reload enabled • Changes take effect immediately</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    function showVariant(variant) {
      document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
      document.getElementById('variant-' + variant).classList.add('active');
      event.target.classList.add('active');
    }

    function updateStatus(value) {
      const labels = {
        'claude': 'Claude (anthropic.com)',
        'zai': 'z.AI (api.z.ai)',
        'ollama': 'Local Ollama (home PC)'
      };
      document.getElementById('status-text').textContent = 'Active: ' + labels[value];
    }

    function updateStatusC(value) {
      // Inline variant has fixed status text
    }

    function selectRadio(element, label) {
      document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');
      element.querySelector('input').checked = true;
      document.getElementById('status-text-b').textContent = 'Active: ' + label;
    }
  </script>
</body>
</html>
